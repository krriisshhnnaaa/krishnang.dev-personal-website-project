<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Action — Krishnang</title>
    <link rel="stylesheet" href="../CSS/radial-menu.css">
    <style>
        :root {
            --glow-color: rgba(255, 45, 85, 0.55); /* reddish-pink with 55% glow intensity */
            --text-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            /* Page styling: bg-img = bg_img.jpg */
            background-color: #f7f9fc;
            background-image: url('bg_img.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* H1 styling:
           glowintensity: 55%; colour: textcolor: black, glowcolor: reddish-pink, text-align: center
        */
        h1 {
            color: var(--text-color);
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.3;
            text-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color), 0 0 35px var(--glow-color);
        }

        /* Form styling: txtcolor: black */
        form {
            display: flex;
            flex-direction: column;
            gap: 24px;
            color: var(--text-color);
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .radio-label:hover {
            border-color: #ff2d55;
            background: #fff;
            box-shadow: 0 4px 12px rgba(255, 45, 85, 0.15);
        }

        .radio-label input[type="radio"] {
            appearance: auto;
            width: 20px;
            height: 20px;
            accent-color: #ff2d55;
            cursor: pointer;
        }

        .radio-label:has(input[type="radio"]:checked) {
            border-color: #ff2d55;
            background: rgba(255, 45, 85, 0.05);
            box-shadow: 0 0 12px rgba(255, 45, 85, 0.25);
        }

        button[type="submit"] {
            background-color: #ff2d55;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(255, 45, 85, 0.4);
            align-self: center;
            min-width: 160px;
        }

        button[type="submit"]:hover {
            background-color: #e02449;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 45, 85, 0.5);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>HI ! what would you like to do ? connect with me or leave a review</h1>

        <form id="choiceForm" onsubmit="handleChoiceSubmit(event)">
            <div class="options-group">
                <label class="radio-label">
                    <input type="radio" name="radio_choice" value="leave a review">
                    <span>leave a review</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="radio_choice" value="connect with me">
                    <span>connect with me</span>
                </label>
            </div>

            <button type="submit" id="submitbutt-on">Submit</button>
        </form>
    </main>

    <script>
        function handleChoiceSubmit(event) {
            event.preventDefault();

            const selectedOption = document.querySelector('input[name="radio_choice"]:checked');
            const choice = selectedOption ? selectedOption.value : null;

            if (choice === 'connect with me') {
                window.location.href = 'tempc.html';
            } else if (choice === 'leave a review') {
                window.location.href = 'tempr.html';
            } else {
                window.location.href = 'tempe.html';
            }
        }
    </script>
    <!-- Compact Radial Action Menu (agy.info action NOW) -->
    <div class="radial-menu-container">
        <nav class="menu" aria-label="Radial navigation menu">
            <button type="button" class="center-btn" aria-label="Toggle navigation actions" title="Quick Navigation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <a href="connect.html" class="action action-n" aria-label="Action A: Connect">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span class="tooltip">Action A: Connect</span>
            </a>
            <a href="choicepage.html" class="action action-e" aria-label="Action B: Choice Page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
                <span class="tooltip">Action B: Choice</span>
            </a>
            <a href="../fun/game/game.html" class="action action-s" aria-label="Action C: Play Game">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span class="tooltip">Action C: Game</span>
            </a>
            <a href="../index.html" class="action action-w" aria-label="Action D: Home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="tooltip">Action D: Home</span>
            </a>
        </nav>
    </div>
</body>
</html>
