<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal — krishnang.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../logo.jpg">
    <link rel="stylesheet" href="../CSS/unslop-base.css">
    <link rel="stylesheet" href="../CSS/radial-menu.css">
    <style>
        .portal-main {
            min-height: calc(100vh - 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px 80px;
        }

        .portal-card {
            width: 100%;
            max-width: 520px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .portal-eyebrow {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--ink-muted);
            margin: 0 0 8px;
        }

        .portal-title {
            margin: 0;
            font-size: 28px;
            line-height: 1.2;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--ink-text);
        }

        .portal-desc {
            margin: 8px 0 0;
            font-size: 14px;
            line-height: 1.55;
            color: var(--ink-secondary);
        }

        .portal-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            border-radius: 12px;
            background-color: var(--ink-raised);
            border: 1px solid var(--ink-hairline);
            cursor: pointer;
            transition:
                background-color var(--dur-fast) var(--ease-unslop),
                border-color var(--dur-fast) var(--ease-unslop);
        }

        .radio-option:hover {
            background-color: var(--ink-hover);
            border-color: var(--ink-hairline-strong);
        }

        .radio-option:has(input[type="radio"]:checked) {
            background-color: var(--ink-hover);
            border-color: var(--ink-accent);
        }

        .radio-option input[type="radio"] {
            margin: 3px 0 0;
            width: 16px;
            height: 16px;
            accent-color: var(--ink-accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        .option-copy {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .option-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--ink-text);
        }

        .option-hint {
            font-size: 13px;
            color: var(--ink-muted);
        }

        .portal-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--ink-hairline);
        }
    </style>
</head>
<body>
    <header class="ink-topbar">
        <div class="ink-topbar-inner">
            <a href="../index.html" class="ink-brand">
                <span class="ink-brand-prompt">&gt;</span>
                <span>krishnang.dev</span>
            </a>
            <nav class="ink-nav-links" aria-label="Portal navigation">
                <a href="../index.html" class="ink-nav-link">Home</a>
                <a href="connect.html" class="ink-nav-link">Connect</a>
                <a href="review.html" class="ink-nav-link">Reviews</a>
                <a href="../fun/game/game.html" class="ink-nav-link">Arcade</a>
            </nav>
        </div>
    </header>

    <main class="portal-main">
        <section class="ink-card portal-card" aria-labelledby="portalHeading">
            <div>
                <p class="portal-eyebrow">&gt; forms/choice</p>
                <h1 id="portalHeading" class="portal-title">How would you like to proceed</h1>
                <p class="portal-desc">Choose whether to open social and work profiles or leave feedback on past work.</p>
            </div>

            <form id="choiceForm" class="portal-form" onsubmit="handleChoiceSubmit(event)">
                <div class="options-group" role="radiogroup" aria-labelledby="portalHeading">
                    <label class="radio-option">
                        <input type="radio" name="radio_choice" value="leave a review">
                        <span class="option-copy">
                            <span class="option-title">Leave a review</span>
                            <span class="option-hint">Write feedback and read notes from collaborators</span>
                        </span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="radio_choice" value="connect with me">
                        <span class="option-copy">
                            <span class="option-title">Connect with me</span>
                            <span class="option-hint">Browse GitHub, LinkedIn, freelance, and social profiles</span>
                        </span>
                    </label>
                </div>

                <div class="portal-actions">
                    <a href="../index.html" class="ink-btn ink-btn-secondary">Back home</a>
                    <button type="submit" id="submitbutt-on" class="ink-btn ink-btn-primary">Continue</button>
                </div>
            </form>
        </section>
    </main>

    <div class="radial-menu-container">
        <nav class="menu" aria-label="Quick navigation menu">
            <button type="button" class="center-btn" aria-label="Toggle navigation actions" title="Quick navigation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <a href="connect.html" class="action action-n" aria-label="Connect">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span class="tooltip">Connect</span>
            </a>
            <a href="choicepage.html" class="action action-e" aria-label="Portal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
                <span class="tooltip">Portal</span>
            </a>
            <a href="../fun/game/game.html" class="action action-s" aria-label="Arcade">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span class="tooltip">Arcade</span>
            </a>
            <a href="../index.html" class="action action-w" aria-label="Home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="tooltip">Home</span>
            </a>
        </nav>
    </div>

    <script>
        function handleChoiceSubmit(event) {
            event.preventDefault();
            const selectedOption = document.querySelector('input[name="radio_choice"]:checked');
            const choice = selectedOption ? selectedOption.value : null;

            if (choice === 'connect with me') {
                window.location.href = 'tempc.html';
            } else if (choice === 'leave a review') {
                window.location.href = 'tempr.html';
            } else {
                window.location.href = 'tempe.html';
            }
        }
    </script>
</body>
</html>
