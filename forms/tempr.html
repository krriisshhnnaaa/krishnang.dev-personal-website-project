<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Review — krishnang.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../logo.jpg">
    <link rel="stylesheet" href="../CSS/unslop-base.css">
    <style>
        .dialog-main {
            min-height: calc(100vh - 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .dialog-card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .dialog-meta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--ink-muted);
        }
        .dialog-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--ink-accent);
        }
        .dialog-title {
            margin: 0;
            font-size: 22px;
            line-height: 1.25;
            font-weight: 500;
            color: var(--ink-text);
        }
        .dialog-desc {
            margin: 0;
            font-size: 14px;
            line-height: 1.55;
            color: var(--ink-secondary);
        }
        .dialog-actions {
            display: flex;
            gap: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--ink-hairline);
        }
        .dialog-actions .ink-btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <header class="ink-topbar">
        <div class="ink-topbar-inner">
            <a href="../index.html" class="ink-brand">
                <span class="ink-brand-prompt">&gt;</span>
                <span>krishnang.dev</span>
            </a>
            <nav class="ink-nav-links" aria-label="Navigation">
                <a href="choicepage.html" class="ink-nav-link">Portal</a>
                <a href="../index.html" class="ink-nav-link">Home</a>
            </nav>
        </div>
    </header>

    <main class="dialog-main">
        <div class="ink-card dialog-card" id="windowNotification" role="dialog" aria-modal="true" aria-labelledby="popQuestion">
            <div class="dialog-meta">
                <span class="dialog-dot"></span>
                <span>Review submission</span>
            </div>
            <h1 id="popQuestion" class="dialog-title">Continue to the review board</h1>
            <p class="dialog-desc">Submit feedback about working together or read published notes from collaborators.</p>
            <div class="dialog-actions">
                <button type="button" class="ink-btn ink-btn-secondary" onclick="handleDecision('no')">Cancel</button>
                <button type="button" class="ink-btn ink-btn-primary" onclick="handleDecision('yes')">Continue</button>
            </div>
        </div>
    </main>

    <script>
        function handleDecision(choice) {
            if (choice === 'yes') {
                window.location.href = 'review.html';
            } else {
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
