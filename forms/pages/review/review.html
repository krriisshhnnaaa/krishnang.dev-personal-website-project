<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews — krishnang.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../../../logo.jpg">
    <link rel="stylesheet" href="../../../CSS/unslop-base.css">
    <link rel="stylesheet" href="../../../CSS/radial-menu.css">
    <style>
        .reviews-main {
            max-width: 1152px;
            margin: 0 auto;
            padding: 40px 24px 96px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .reviews-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--ink-hairline);
        }

        .reviews-eyebrow {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--ink-muted);
            margin: 0;
        }

        .reviews-title {
            margin: 0;
            font-size: clamp(28px, 4vw, 36px);
            line-height: 1.15;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--ink-text);
        }

        .reviews-subtitle {
            margin: 0;
            font-size: 15px;
            color: var(--ink-secondary);
            max-width: 560px;
        }

        .reviews-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            align-items: start;
        }

        .form-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-heading {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
            color: var(--ink-text);
        }

        .review-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-secondary);
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            background-color: var(--ink-raised);
            border: 1px solid var(--ink-hairline);
            color: var(--ink-text);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            transition:
                border-color var(--dur-fast) var(--ease-unslop),
                background-color var(--dur-fast) var(--ease-unslop);
        }

        .form-control::placeholder {
            color: var(--ink-muted);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--ink-accent);
            background-color: var(--ink-page);
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        .status-msg {
            display: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            background-color: rgba(76, 195, 138, 0.12);
            color: var(--ink-positive);
            border: 1px solid rgba(76, 195, 138, 0.25);
        }

        .reviews-feed-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .reviews-feed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .others-think-title {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
            color: var(--ink-text);
        }

        .reviews-count {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--ink-muted);
            font-variant-numeric: tabular-nums;
        }

        .reviews-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .review-card {
            background-color: var(--ink-card);
            border: 1px solid var(--ink-hairline);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            word-break: break-word;
        }

        .review-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--ink-text);
            white-space: pre-wrap;
        }

        .review-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--ink-hairline);
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .review-author {
            color: var(--ink-secondary);
        }

        .review-date {
            color: var(--ink-muted);
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 960px) {
            .reviews-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .reviews-main {
                padding: 24px 16px 88px;
            }
            .reviews-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="ink-topbar">
        <div class="ink-topbar-inner">
            <a href="../../../index.html" class="ink-brand">
                <span class="ink-brand-prompt">&gt;</span>
                <span>krishnang.dev</span>
            </a>
            <nav class="ink-nav-links" aria-label="Reviews navigation">
                <a href="../../../index.html" class="ink-nav-link">Home</a>
                <a href="../../choicepage.html" class="ink-nav-link">Portal</a>
                <a href="../../connect.html" class="ink-nav-link">Connect</a>
                <a href="review.html" class="ink-nav-link" aria-current="page">Reviews</a>
                <a href="../../../fun/game/game.html" class="ink-nav-link">Arcade</a>
            </nav>
        </div>
    </header>

    <main class="reviews-main">
        <div class="reviews-header">
            <p class="reviews-eyebrow">&gt; forms/review</p>
            <h1 class="reviews-title">Reviews &amp; feedback</h1>
            <p class="reviews-subtitle">Notes from clients, collaborators, and engineering peers.</p>
        </div>

        <div class="reviews-layout">
            <aside class="ink-card form-card" aria-labelledby="reviewFormHeading">
                <h2 id="reviewFormHeading" class="form-heading">Leave a review</h2>
                <form id="reviewForm" class="review-form">
                    <div class="form-group">
                        <label for="reviewContent" class="form-label">Review</label>
                        <textarea
                            id="reviewContent"
                            name="review"
                            rows="4"
                            class="form-control"
                            placeholder="Share feedback on collaboration, architecture, or delivery"
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="reviewerName" class="form-label">Your name</label>
                        <input
                            type="text"
                            id="reviewerName"
                            name="name"
                            class="form-control"
                            placeholder="Name or role"
                            required>
                    </div>

                    <button type="submit" class="ink-btn ink-btn-primary" id="submitBtn">Submit review</button>
                    <div class="status-msg" id="statusMessage" role="status">Review saved.</div>
                </form>
            </aside>

            <section class="reviews-feed-section" id="heroReviewsSection" aria-labelledby="othersThinkTitle">
                <div class="reviews-feed-header">
                    <h2 id="othersThinkTitle" class="others-think-title">What others think</h2>
                    <span class="reviews-count" id="reviewsCount">0 entries</span>
                </div>

                <div id="reviewsContainer" class="reviews-container"></div>
            </section>
        </div>
    </main>

    <div class="radial-menu-container">
        <nav class="menu" aria-label="Quick navigation menu">
            <button type="button" class="center-btn" aria-label="Toggle navigation actions" title="Quick navigation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <a href="../../connect.html" class="action action-n" aria-label="Connect">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span class="tooltip">Connect</span>
            </a>
            <a href="../../choicepage.html" class="action action-e" aria-label="Portal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
                <span class="tooltip">Portal</span>
            </a>
            <a href="../../../fun/game/game.html" class="action action-s" aria-label="Arcade">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span class="tooltip">Arcade</span>
            </a>
            <a href="../../../index.html" class="action action-w" aria-label="Home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="tooltip">Home</span>
            </a>
        </nav>
    </div>

    <script>
        const defaultReviews = [
            {
                name: "",
                content: "Krishnang is an exceptionally detail-oriented developer. The architecture and user interface built for the platform exceeded all our expectations!"
            },
            {
                name: "",
                content: "Fast communication, innovative ideas, and clean modern code. An absolute pleasure to collaborate with."
            },
            {
                name: "",
                content: "Incredible attention to styling details, rock-solid responsiveness, and rapid turnaround time."
            },
            {
                name: "",
                content: "Intuitive workflows, creative layout solutions, and smooth end-to-end integration."
            }
        ];

        function getStoredReviews() {
            try {
                const data = localStorage.getItem('krishnang_reviews');
                if (data) {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        if (parsed.length < 2) {
                            return [...parsed, ...defaultReviews.slice(parsed.length)];
                        }
                        return parsed;
                    }
                }
            } catch (e) {
                console.warn('Could not read from localStorage', e);
            }
            return defaultReviews;
        }

        function saveStoredReviews(reviews) {
            try {
                localStorage.setItem('krishnang_reviews', JSON.stringify(reviews));
            } catch (e) {
                console.warn('Could not save to localStorage', e);
            }
        }

        function formatTimestamp(ts) {
            if (!ts) return 'Archived';
            const d = new Date(ts);
            if (Number.isNaN(d.getTime())) return 'Archived';
            return d.toISOString().slice(0, 10);
        }

        function renderReviewCard(review) {
            const card = document.createElement('article');
            card.className = 'review-card';

            const contentElem = document.createElement('p');
            contentElem.className = 'review-content';
            contentElem.style.margin = '0';
            contentElem.textContent = review.content || '';

            const footerElem = document.createElement('div');
            footerElem.className = 'review-footer';

            const authorElem = document.createElement('span');
            authorElem.className = 'review-author';
            authorElem.textContent = review.name ? review.name : 'Anonymous';

            const dateElem = document.createElement('span');
            dateElem.className = 'review-date';
            dateElem.textContent = formatTimestamp(review.timestamp);

            footerElem.appendChild(authorElem);
            footerElem.appendChild(dateElem);

            card.appendChild(contentElem);
            card.appendChild(footerElem);

            return card;
        }

        function updateCount(n) {
            const countEl = document.getElementById('reviewsCount');
            if (countEl) {
                countEl.textContent = `${n} ${n === 1 ? 'entry' : 'entries'}`;
            }
        }

        function renderAllReviews(reviewsList) {
            const container = document.getElementById('reviewsContainer');
            container.innerHTML = '';
            reviewsList.forEach(review => {
                container.appendChild(renderReviewCard(review));
            });
            updateCount(reviewsList.length);
        }

        async function fetchReviews() {
            try {
                const res = await fetch('/api/reviews', { method: 'GET' });
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        renderAllReviews(data);
                        return;
                    }
                }
            } catch (err) {
                // Backend not connected; fallback to local storage
            }

            renderAllReviews(getStoredReviews());
        }

        const reviewForm = document.getElementById('reviewForm');
        const statusMessage = document.getElementById('statusMessage');

        reviewForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const review = document.getElementById('reviewContent').value.trim();
            const name = document.getElementById('reviewerName').value.trim();
            if (!review || !name) return;

            const newReview = {
                name: name,
                content: review,
                timestamp: new Date().toISOString()
            };

            const currentList = getStoredReviews();
            currentList.unshift(newReview);
            saveStoredReviews(currentList);

            const container = document.getElementById('reviewsContainer');
            container.insertBefore(renderReviewCard(newReview), container.firstChild);
            updateCount(container.children.length);

            try {
                await fetch('/api/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newReview)
                });
            } catch (err) {
                // Local copy already saved
            }

            statusMessage.style.display = 'block';
            reviewForm.reset();

            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 4000);
        });

        fetchReviews();
    </script>
</body>
</html>
